plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.edu.chamthi2025'
    compileSdk 34

    defaultConfig {
        applicationId "vn.edu.chamthi2025"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.2025"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
